name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Automation script tests
        shell: pwsh
        run: |
          ./scripts/Automation.Tests.ps1
          node --test tools/check/schema-text.test.mjs
      - name: Same checks as local development
        shell: pwsh
        run: ./dev.ps1 check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: artifacts/checks/
          if-no-files-found: ignore
